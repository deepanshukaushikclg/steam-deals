name: update-data
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python fetch.py
      - run: python notify.py
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
      - name: Open issue (GitHub emails you)
        if: hashFiles('issue.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "$(head -1 issue.md)" --body "$(tail -n +2 issue.md)"
          rm issue.md
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json seen.json 2>/dev/null || git add data.json
          git diff --cached --quiet || (git commit -m "update data" && git push)
