<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Steam Deals Tracker</title>

<style>
  :root {
    --bg: #0e141b;
    --panel: #17202b;
    --card: #1d2938;
    --ink: #e8eef5;
    --mute: #8fa1b3;
    --green: #a4d007;
    --greenbg: #4c6b22;
    --blue: #66c0f4;
    --tag: #2a475e;
    --border: #2b3b4d;
  }

  * {
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  /* =========================
     HEADER
     ========================= */

  header {
    background: linear-gradient(#1b2838, #17202b);
    border-bottom: 1px solid #000;
  }

  .bar {
    max-width: 1100px;
    margin: 0 auto;
    padding: 14px 16px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 12px;
    flex-wrap: wrap;
  }

  .logo {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: .3px;
  }

  .logo span {
    color: var(--blue);
  }

  .nav {
    display: flex;
    gap: 8px;
  }

  .nav a {
    color: var(--ink);
    text-decoration: none;

    background: var(--tag);

    padding: 6px 12px;
    border-radius: 3px;

    font-size: .9rem;

    transition:
      background .12s,
      color .12s;
  }

  .nav a:hover,
  .nav a:focus-visible {
    background: var(--blue);
    color: #0e141b;
  }


  /* =========================
     MAIN
     ========================= */

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 8px 16px 48px;
  }

  .head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;

    margin: 28px 0 12px;

    gap: 8px;
    flex-wrap: wrap;
  }

  h2 {
    margin: 0;

    font-size: 1.2rem;
    font-weight: 600;

    border-left: 4px solid var(--blue);
    padding-left: 10px;
  }

  .meta {
    color: var(--mute);
    font-size: .85rem;
  }


  /* =========================
     GAME GRID
     ========================= */

  .grid {
    display: grid;

    grid-template-columns:
      repeat(auto-fill, minmax(230px, 1fr));

    gap: 14px;
  }


  /* =========================
     GAME CARD
     ========================= */

  .item {
    position: relative;

    display: flex;
    flex-direction: column;

    background: var(--card);

    border-radius: 4px;
    overflow: hidden;

    color: inherit;
    text-decoration: none;

    border: 1px solid var(--border);

    transition:
      transform .12s,
      border-color .12s;
  }

  .item:hover,
  .item:focus-visible {
    transform: translateY(-3px);
    border-color: var(--blue);
  }

  .item img {
    width: 100%;

    aspect-ratio: 460 / 215;

    object-fit: cover;

    background: #101922;

    display: block;
  }

  .rank {
    position: absolute;

    top: 8px;
    left: 8px;

    background: rgba(0, 0, 0, .75);

    color: #fff;

    font-size: .75rem;
    font-weight: 700;

    padding: 2px 7px;

    border-radius: 3px;

    z-index: 2;
  }


  /* =========================
     CARD BODY
     ========================= */

  .body {
    padding: 10px 12px 12px;

    display: flex;
    flex-direction: column;

    gap: 10px;

    flex: 1;
  }

  .title {
    font-weight: 600;

    line-height: 1.3;

    display: -webkit-box;

    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;

    overflow: hidden;

    min-height: 2.6em;
  }


  /* =========================
     PRICE
     ========================= */

  .buy {
    margin-top: auto;

    display: flex;

    justify-content: flex-end;
    align-items: stretch;

    gap: 1px;
  }

  .off {
    background: var(--greenbg);

    color: var(--green);

    font-weight: 700;
    font-size: 1.05rem;

    padding: 4px 8px;

    display: flex;
    align-items: center;

    border-radius: 3px 0 0 3px;
  }

  .prices {
    background: #0e141b;

    padding: 2px 10px;

    text-align: right;

    display: flex;
    flex-direction: column;

    justify-content: center;

    border-radius: 0 3px 3px 0;

    min-width: 82px;
  }

  .prices s {
    color: var(--mute);

    font-size: .75rem;

    line-height: 1.1;
  }

  .prices b {
    color: var(--green);

    font-size: .95rem;

    line-height: 1.2;
  }


  /* =========================
     EMPTY STATE
     ========================= */

  .empty {
    color: var(--mute);

    padding: 20px;

    background: var(--panel);

    border-radius: 4px;

    grid-column: 1 / -1;
  }


  /* =========================
     FOOTER
     ========================= */

  footer {
    color: var(--mute);

    font-size: .8rem;

    margin-top: 32px;

    line-height: 1.6;
  }


  /* =========================
     MOBILE
     ========================= */

  @media (max-width: 520px) {

    .grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .body {
      padding: 8px;
    }

    .title {
      font-size: .9rem;
    }

    .off {
      font-size: .9rem;
      padding: 4px 6px;
    }

    .prices {
      padding: 2px 7px;
      min-width: 70px;
    }

    .prices b {
      font-size: .85rem;
    }
  }


  /* =========================
     REDUCED MOTION
     ========================= */

  @media (prefers-reduced-motion: reduce) {

    html {
      scroll-behavior: auto;
    }

    .item {
      transition: none;
    }

    .nav a {
      transition: none;
    }
  }
</style>
</head>


<body>

<header>

  <div class="bar">

    <div class="logo">
      Steam <span>Deals</span>
    </div>

    <nav class="nav">

      <a href="#free">
        Free now
      </a>

      <a href="#cheap" id="nav-cheap">
        Under ₹250
      </a>

    </nav>

  </div>

</header>


<main>

  <!-- =========================
       FREE GAMES
       ========================= -->

  <div class="head">

    <h2 id="free">
      Free right now
    </h2>

    <span class="meta" id="free-count">
      Loading…
    </span>

  </div>

  <div
    class="grid"
    id="free-grid">
  </div>


  <!-- =========================
       CHEAP GAMES
       ========================= -->

  <div class="head">

    <h2 id="cheap">

      <span id="cheap-t">
        Under ₹250
      </span>

    </h2>

    <span
      class="meta"
      id="cheap-count">
      Loading…
    </span>

  </div>

  <div
    class="grid"
    id="cheap-grid">
  </div>


  <!-- =========================
       FOOTER
       ========================= -->

  <footer>

    <div>
      Prices are converted from USD to INR.
      Steam India prices may differ slightly.
    </div>

    <div id="rate-info">
      Exchange rate: Loading…
    </div>

    <div id="last-update">
      Last updated: Loading…
    </div>

  </footer>

</main>


<script>

/* ============================================================
   HELPERS
   ============================================================ */

const fmt = (number) => {

  if (
    number === null ||
    number === undefined ||
    Number.isNaN(Number(number))
  ) {
    return "—";
  }

  return "₹" + Number(number).toLocaleString("en-IN");
};


/* ============================================================
   IMAGE FALLBACK
   ============================================================ */

function setImage(img, url, title) {

  img.alt = title || "";

  if (!url) {

    img.style.display = "none";

    return;
  }

  img.src = url;

  img.onerror = () => {

    img.style.display = "none";

  };
}


/* ============================================================
   RENDER GAMES
   ============================================================ */

function render(id, items, paid) {

  const el = document.getElementById(id);

  if (!Array.isArray(items) || items.length === 0) {

    el.innerHTML =
      '<div class="empty">Nothing here right now.</div>';

    return;
  }

  el.innerHTML = "";


  items.forEach((g, i) => {

    const a = document.createElement("a");

    a.className = "item";

    a.href = g.url || "#";

    a.target = "_blank";

    a.rel = "noopener noreferrer";


    /* =========================
       DISCOUNT
       ========================= */

    let discount;

    if (paid) {

      const off = Number(g.off);

      discount =
        Number.isFinite(off)
          ? `-${off}%`
          : "SALE";

    } else {

      discount = "-100%";

    }


    /* =========================
       CURRENT PRICE
       ========================= */

    const now = paid
      ? fmt(g.sale_inr)
      : "Free";


    /* =========================
       ORIGINAL PRICE
       ========================= */

    const original = fmt(g.price_inr);


    /* =========================
       CARD
       ========================= */

    a.innerHTML = `

      <span class="rank">
        #${i + 1}
      </span>

      <img
        loading="lazy"
        alt=""
      >

      <div class="body">

        <div class="title"></div>

        <div class="buy">

          <div class="off">
            ${discount}
          </div>

          <div class="prices">

            <s>
              ${original}
            </s>

            <b>
              ${now}
            </b>

          </div>

        </div>

      </div>
    `;


    /* =========================
       TITLE
       ========================= */

    const title =
      a.querySelector(".title");

    title.textContent =
      g.title || "Unknown game";


    /* =========================
       IMAGE
       ========================= */

    const img =
      a.querySelector("img");

    setImage(
      img,
      g.image,
      g.title
    );


    el.appendChild(a);

  });
}


/* ============================================================
   LOAD DATA
   ============================================================ */

fetch(
  "data.json",
  {
    cache: "no-store"
  }
)

.then(response => {

  if (!response.ok) {

    throw new Error(
      `HTTP ${response.status}`
    );

  }

  return response.json();

})

.then(data => {


  /* ==========================================================
     LIMIT
     ========================================================== */

  const limit =
    Number(data.limit_inr) || 250;


  /* ==========================================================
     NAVIGATION / HEADINGS
     ========================================================== */

  const limitText =
    `Under ${fmt(limit)}`;


  document.getElementById(
    "cheap-t"
  ).textContent = limitText;


  document.getElementById(
    "nav-cheap"
  ).textContent = limitText;


  /* ==========================================================
     COUNTS
     ========================================================== */

  const free =
    Array.isArray(data.free)
      ? data.free
      : [];


  const cheap =
    Array.isArray(data.cheap)
      ? data.cheap
      : [];


  document.getElementById(
    "free-count"
  ).textContent =
    `${free.length} game${free.length === 1 ? "" : "s"}`;


  document.getElementById(
    "cheap-count"
  ).textContent =
    `${cheap.length} game${cheap.length === 1 ? "" : "s"} on sale`;


  /* ==========================================================
     RENDER
     ========================================================== */

  render(
    "free-grid",
    free,
    false
  );


  render(
    "cheap-grid",
    cheap,
    true
  );


  /* ==========================================================
     EXCHANGE RATE
     ========================================================== */

  if (
    data.currency &&
    data.currency.rate
  ) {

    document.getElementById(
      "rate-info"
    ).textContent =
      `Exchange rate: $1 = ₹${Number(
        data.currency.rate
      ).toFixed(2)}`;

  }


  /* ==========================================================
     LAST UPDATE
     ========================================================== */

  if (data.updated) {

    const date =
      new Date(data.updated);


    if (!Number.isNaN(date.getTime())) {

      document.getElementById(
        "last-update"
      ).textContent =
        "Last updated: " +
        date.toLocaleString("en-IN");

    }

  }

})

.catch(error => {

  console.error(
    "Could not load data.json:",
    error
  );


  document.getElementById(
    "free-count"
  ).textContent =
    "Could not load data";


  document.getElementById(
    "cheap-count"
  ).textContent =
    "Could not load data";


  document.getElementById(
    "free-grid"
  ).innerHTML =
    `<div class="empty">
      Could not load deals. Please try again later.
    </div>`;


  document.getElementById(
    "cheap-grid"
  ).innerHTML =
    `<div class="empty">
      Could not load deals. Please try again later.
    </div>`;

});

</script>

</body>
</html>
