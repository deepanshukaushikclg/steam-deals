<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steam deals tracker</title>
<style>
  :root { --bg:#0e141b; --panel:#17202b; --card:#1d2938; --ink:#e8eef5; --mute:#8fa1b3;
          --green:#a4d007; --greenbg:#4c6b22; --blue:#66c0f4; --tag:#2a475e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; }
  header { background:linear-gradient(#1b2838,#17202b); border-bottom:1px solid #000; }
  .bar { max-width:1100px; margin:0 auto; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .logo { font-size:1.25rem; font-weight:700; letter-spacing:.3px; }
  .logo span { color:var(--blue); }
  .nav { display:flex; gap:8px; }
  .nav a { color:var(--ink); text-decoration:none; background:var(--tag); padding:6px 12px; border-radius:3px; font-size:.9rem; }
  .nav a:hover, .nav a:focus-visible { background:var(--blue); color:#0e141b; }
  main { max-width:1100px; margin:0 auto; padding:8px 16px 48px; }
  .head { display:flex; align-items:baseline; justify-content:space-between; margin:28px 0 12px; gap:8px; flex-wrap:wrap; }
  h2 { margin:0; font-size:1.2rem; font-weight:600; border-left:4px solid var(--blue); padding-left:10px; }
  .meta { color:var(--mute); font-size:.85rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
  .item { position:relative; display:flex; flex-direction:column; background:var(--card); border-radius:4px; overflow:hidden;
          color:inherit; text-decoration:none; border:1px solid #2b3b4d; transition:transform .12s, border-color .12s; }
  .item:hover, .item:focus-visible { transform:translateY(-3px); border-color:var(--blue); }
  .item img { width:100%; aspect-ratio:460/215; object-fit:cover; background:#101922; display:block; }
  .rank { position:absolute; top:8px; left:8px; background:rgba(0,0,0,.75); color:#fff; font-size:.75rem; font-weight:700; padding:2px 7px; border-radius:3px; }
  .body { padding:10px 12px 12px; display:flex; flex-direction:column; gap:10px; flex:1; }
  .title { font-weight:600; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:2.6em; }
  .buy { margin-top:auto; display:flex; justify-content:flex-end; align-items:stretch; gap:1px; }
  .off { background:var(--greenbg); color:var(--green); font-weight:700; font-size:1.05rem; padding:4px 8px; display:flex; align-items:center; border-radius:3px 0 0 3px; }
  .prices { background:#0e141b; padding:2px 10px; text-align:right; display:flex; flex-direction:column; justify-content:center; border-radius:3px; }
  .off + .prices { border-radius:0 3px 3px 0; }
  .prices s { color:var(--mute); font-size:.75rem; line-height:1.1; }
  .prices b { color:var(--green); font-size:.95rem; line-height:1.2; }
  .empty { color:var(--mute); padding:20px; background:var(--panel); border-radius:4px; }
  footer { color:var(--mute); font-size:.8rem; margin-top:32px; }
  @media (max-width:520px) { .grid { grid-template-columns:repeat(2,1fr); gap:10px; } .body { padding:8px; } }
  @media (prefers-reduced-motion:reduce) { .item { transition:none; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo">Steam <span>Deals</span></div>
    <nav class="nav"><a href="#free">Free now</a><a href="#cheap" id="nav-cheap">Under ₹150</a></nav>
  </div>
</header>
<main>
  <div class="head"><h2 id="free">Free right now</h2><span class="meta" id="updated">Loading…</span></div>
  <div class="grid" id="free-grid"></div>

  <div class="head"><h2 id="cheap"><span id="cheap-t">Under ₹150</span></h2><span class="meta">Highest original price first</span></div>
  <div class="grid" id="cheap-grid"></div>

  <footer>Prices converted from USD; Steam India may differ slightly. Free list ranked by original price.</footer>
</main>
<script>
const fmt = n => "₹" + n.toLocaleString("en-IN");
function render(id, items, paid) {
  const el = document.getElementById(id);
  if (!items.length) { el.innerHTML = '<div class="empty">Nothing here right now.</div>'; return; }
  el.innerHTML = "";
  items.forEach((g, i) => {
    const a = document.createElement("a");
    a.className = "item"; a.href = g.url; a.target = "_blank"; a.rel = "noopener";
    const off = paid ? `-${g.off}%` : "-100%";
    const now = paid ? fmt(g.sale_inr) : "Free";
    a.innerHTML = `<span class="rank">#${i + 1}</span>
      <img loading="lazy" alt="">
      <div class="body"><div class="title"></div>
        <div class="buy"><div class="off">${off}</div>
        <div class="prices"><s>${fmt(g.price_inr)}</s><b>${now}</b></div></div></div>`;
    a.querySelector(".title").textContent = g.title;
    const img = a.querySelector("img");
    img.src = g.image || ""; img.alt = g.title;
    img.onerror = () => { img.style.visibility = "hidden"; };
    el.appendChild(a);
  });
}
fetch("data.json", { cache:"no-store" }).then(r => r.json()).then(d => {
  const t = `Under ₹${d.limit_inr}`;
  document.getElementById("cheap-t").textContent = t;
  document.getElementById("nav-cheap").textContent = t;
  document.getElementById("updated").textContent = "Updated " + new Date(d.updated).toLocaleString("en-IN");
  render("free-grid", d.free, false);
  render("cheap-grid", d.cheap, true);
}).catch(() => document.getElementById("updated").textContent = "Could not load data.json");
</script>
</body>
</html>
